services:
  api:
    build: .
    command: uv run api.py
    ports:
      - "5000:5000"

  frontend:
    build: .
    command: uv run streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      # Inde i Docker finder frontenden API'en via service-navnet "api"
      API_URL: http://api:5000
    depends_on:
      - api
